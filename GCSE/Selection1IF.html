<!doctype html>
<html>
    <head>
        <title>Parsons Puzzle Assignment</title>
        <link href="../parsons.css" rel="stylesheet" />
        <link href="../lib/prettify.css" rel="stylesheet" />
        <script src="../lib/prettify.js"></script>
        <style>
            /* Custom styling for prominent buttons */
            .puzzle-controls {
                text-align: center;
                margin-top: 20px;
            }
            .btn-check {
                display: inline-block;
                background-color: #0066cc;
                color: #ffffff;
                font-size: 18px;
                font-weight: bold;
                padding: 12px 30px;
                border: none;
                border-radius: 6px;
                text-decoration: none;
                cursor: pointer;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                transition: background-color 0.2s ease;
                margin-right: 15px;
            }
            .btn-check:hover {
                background-color: #004d99;
            }
            .btn-reset {
                display: inline-block;
                background-color: #f1f1f1;
                color: #333333;
                font-size: 16px;
                padding: 12px 20px;
                border: 1px solid #ccc;
                border-radius: 6px;
                text-decoration: none;
                cursor: pointer;
            }
            .btn-reset:hover {
                background-color: #e2e2e2;
            }
        </style>
    </head>
    <body>
        <h2>Parsons Puzzle</h2>
        <p>Reorder the lines to fix the code.</p>
        
        <div id="sortableTrash" class="sortable-code"></div>
        <div id="sortable" class="sortable-code"></div>
        
        <div style="clear:both;"></div>
        
        <!-- Large, centered buttons -->
        <div class="puzzle-controls">
            <a href="#" id="feedbackLink" class="btn-check">Check Solution</a>
            <a href="#" id="newInstanceLink" class="btn-reset">New Instance</a>
        </div>

        <script src="../lib/jquery.min.js"></script>
        <script src="../lib/jquery-ui.min.js"></script>
        <script src="../lib/jquery.ui.touch-punch.min.js"></script>
        <script src="../lib/underscore-min.js"></script>
        <script src="../lib/lis.js"></script>
        <script src="../parsons.js"></script>
        <script>
        var initial = 'import random\n' +
                    'score = random.randint(0, 100)\n' +
                    'if score >= 50:\n' +
                    '    print("Pass")\n' +
                    'else:\n' +
                    '    print("Fail")\n' +
                    'if score => 50: #distractor\n';

        function displayErrors(fb) {
            if(fb.errors.length > 0) {
                alert(fb.errors[0]);
            } else {
                alert("Great job! Your code is correct.");
            }
        } 

        $(document).ready(function(){
            var parson = new ParsonsWidget({
                'sortableId': 'sortable',
                'trashId': 'sortableTrash',
                'max_wrong_lines': 1,
                'feedback_cb' : displayErrors
            });
            parson.init(initial);
            parson.shuffleLines();
            $("#newInstanceLink").click(function(event){
                event.preventDefault();
                parson.shuffleLines();
            });
            $("#feedbackLink").click(function(event){
                event.preventDefault();
                parson.getFeedback();
            });
        });
        </script>
    </body>
</html>
